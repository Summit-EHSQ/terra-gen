$schema: https://api.gitbook.com/gitbook-docs.yaml
version: 1
site:
  title: Terra-Gen Solution Design Documentation
  structure:
    - type: section-group
      key: section-group-phase-1
      title: Phase 1
      children:
        - type: section
          key: section-employee-management
          title: Employee Management
          path: employee-management
          default: true
          children:
            - type: space
              key: space-employee-management
              title: Documentation
              path: documentation
              default: true
              content:
                directory: "./docs/phase 1/employee management"
        - type: section
          key: section-inspections
          title: Inspections
          path: inspections
          children:
            - type: space
              key: space-inspections
              title: Documentation
              path: documentation
              default: true
              content:
                directory: "./docs/phase 1/inspections"
        - type: section
          key: section-platform-administration
          title: Intelex Platform Administration
          path: platform-administration
          children:
            - type: space
              key: space-platform-administration
              title: Documentation
              path: documentation
              default: true
              content:
                directory: "./docs/phase 1/platform administration"
        - type: section
          key: section-training-management
          title: Training and Competency Management
          path: training-management
          children:
            - type: space
              key: space-training-management
              title: Documentation
              path: documentation
              default: true
              content:
                directory: "./docs/phase 1/training management"
    - type: section-group
      key: section-group-phase-2
      title: Phase 2
      children:
        - type: section
          key: section-incident-management
          title: Incident Management
          path: incident-management
          default: true
          children:
            - type: space
              key: space-incident-management
              title: Documentation
              path: documentation
              default: true
              content:
                directory: "./docs/phase 2/incident management"
